name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install perltidy and perlcritic
        run: sudo apt install -y perltidy libperl-critic-perl
      - name: make check
        run: make check
